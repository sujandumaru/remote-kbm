name: Cross-platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}

    env:
      PYNPUT_BACKEND: dummy

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python checks
        run: |
          python -m compileall -q server tests
          python -m unittest discover -s tests -v
          python -c "import aiohttp, pynput, qrcode"

      - name: Parse browser JavaScript
        shell: bash
        run: |
          node - <<'JS'
          const html = require("fs").readFileSync("client/index.html", "utf8");
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (!scripts.length) throw new Error("No inline script found");
          for (const script of scripts) new Function(script[1]);
          JS
          node tests/test-client-connection.js

      - name: Validate shell installers
        if: runner.os != 'Windows'
        run: sh -n install.sh uninstall.sh macos/*.sh linux/*.sh

      - name: Validate PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows, tests -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }

      - name: Test Windows startup success and failure
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & powershell.exe `
            -NoLogo `
            -NoProfile `
            -NonInteractive `
            -ExecutionPolicy Bypass `
            -File tests\test-windows-startup.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
