name: Cross-platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}

    env:
      PYNPUT_BACKEND: dummy

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python checks
        run: |
          python -m compileall -q server tests
          python -m unittest discover -s tests -v
          python -c "import aiohttp, pynput, qrcode"

      - name: Parse browser JavaScript
        shell: bash
        run: |
          node - <<'JS'
          const html = require("fs").readFileSync("client/index.html", "utf8");
          // Match attributes too, or a block with an id would silently skip this check.
          const scripts = [...html.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/g)];
          if (scripts.length < 2) throw new Error(`Expected 2 inline scripts, found ${scripts.length}`);
          for (const script of scripts) new Function(script[1]);
          JS

      - name: Run SteadyTouch self-check
        shell: bash
        run: |
          node - <<'JS'
          const html = require("fs").readFileSync("client/index.html", "utf8");
          const m = html.match(/<script id="steadytouch-core">([\s\S]*?)<\/script>/);
          if (!m) throw new Error("steadytouch-core block not found");
          new Function(m[1] + "\nsteadyTouchSelfCheck();")();
          JS

      - name: Validate shell installers
        if: runner.os != 'Windows'
        run: sh -n install.sh uninstall.sh macos/*.sh linux/*.sh

      - name: Validate PowerShell installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_.Message }
            }
          }
          if ($failed) { exit 1 }
