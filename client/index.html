<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2027">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>remote-kbm</title>
<style>
  :root { --bg:#111418; --pad:#1b2027; --pad2:#232a33; --fg:#e8ecf1; --dim:#8b95a1; --accent:#3d7dfb; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none;
              background:var(--bg); color:var(--fg); font:15px/1.3 system-ui,sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #bar { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--pad); }
  #dot { width:11px; height:11px; border-radius:50%; background:#e0483d; transition:background .2s; }
  #dot.on { background:#37c26b; }
  #bar .grow { flex:1; }
  button { font:inherit; color:var(--fg); background:var(--pad2); border:0; border-radius:9px;
           padding:11px 14px; cursor:pointer; }
  button:active { background:#2f3946; }
  #pad { flex:1; touch-action:none; position:relative; background:var(--bg);
         background-image:radial-gradient(var(--pad2) 1px, transparent 1px); background-size:22px 22px; }
  #pad.held { box-shadow:inset 0 0 0 3px var(--accent); }
  #hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:var(--dim); text-align:center; padding:24px; pointer-events:none; }
  #clicks { display:flex; gap:8px; padding:8px 8px 10px; }
  #clicks button { flex:1; padding:16px; }
  #kb { background:var(--pad); padding:8px; display:none; gap:8px; flex-direction:column; }
  #kb.show { display:flex; }
  #txtrow { display:flex; gap:8px; }
  #txtrow textarea { flex:1; font:16px system-ui; padding:12px; border-radius:9px;
                     border:1px solid var(--pad2); background:var(--bg); color:var(--fg); resize:none; }
  #clr { padding:0 16px; }
  #tabs { display:flex; gap:6px; }
  #tabs .tab { flex:1; padding:10px 4px; background:var(--bg); color:var(--dim); }
  #tabs .tab.on { background:var(--pad2); color:var(--fg); }
  .panel { display:flex; flex-direction:column; gap:8px; }
  .panel[hidden] { display:none; }
  .keys { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .keys button { padding:12px 6px; }
  .mod.on { background:var(--accent); }
  .panel[data-panel="touch"] { max-height:42vh; overflow-y:auto; }
  .set { display:flex; align-items:center; gap:10px; }
  .set label { flex:1; color:var(--dim); font-size:13px; }
  .set input[type=range] { flex:1.2; accent-color:var(--accent); }
  .set output { width:3.6em; text-align:right; font-variant-numeric:tabular-nums; }
  #presets { display:flex; gap:6px; }
  #presets button { flex:1; }
  .set select { flex:1.2; font:inherit; color:var(--fg); background:var(--pad2);
                border:0; border-radius:7px; padding:8px; }
  #dwell { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%;
           pointer-events:none; background:conic-gradient(var(--accent) var(--p), transparent 0);
           mask:radial-gradient(transparent 58%, #000 60%);
           -webkit-mask:radial-gradient(transparent 58%, #000 60%); }
</style>
</head>
<body>
  <div id="bar">
    <span id="dot"></span><span id="stat">connecting…</span>
    <span class="grow"></span>
    <button id="kbtoggle">⌨ Keyboard</button>
  </div>

  <div id="pad">
    <div id="hint">Drag to move · tap = click · two-finger tap = right-click<br>two-finger drag = scroll · pinch = zoom · press-and-hold = drag</div>
    <div id="dwell" hidden></div>
  </div>

  <div id="clicks">
    <button id="lclick">Left click</button>
    <button id="rclick">Right click</button>
    <button id="draglock" class="mod" aria-pressed="false">Drag lock</button>
  </div>

  <div id="kb">
    <div id="tabs">
      <button class="tab on" data-tab="type">Type</button>
      <button class="tab" data-tab="shortcuts">Shortcuts</button>
      <button class="tab" data-tab="media">Media</button>
      <button class="tab" data-tab="fn">Fn</button>
      <button class="tab" data-tab="touch">Touch</button>
    </div>

    <div class="panel" data-panel="type">
      <div id="txtrow">
        <textarea id="txt" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off"
                  spellcheck="false" aria-label="Text to send to the PC"
                  placeholder="Type here — mirrors to the PC"></textarea>
        <button id="clr" title="Clear this echo (nothing sent)">✕</button>
      </div>
      <div class="keys">
        <button data-k="esc">Esc</button><button data-k="tab">Tab</button>
        <button data-k="left">←</button><button data-k="up">↑</button>
        <button data-k="down">↓</button><button data-k="right">→</button>
        <button data-k="enter">Enter</button><button data-k="backspace">⌫</button>
        <button data-k="delete">Del</button>
        <button class="mod" data-mod="ctrl">Ctrl</button><button class="mod" data-mod="alt">Alt</button>
        <button class="mod" data-mod="shift">Shift</button>
        <button class="mod" data-mod="cmd">⊞ Win</button>
      </div>
    </div>

    <div class="panel" data-panel="shortcuts" hidden>
      <div class="keys">
        <button data-combo="cmd">⊞ Start</button>
        <button data-combo="alt+tab">Alt↹Tab</button>
        <button data-combo="ctrl+c">Copy</button>
        <button data-combo="ctrl+v">Paste</button>
        <button data-combo="ctrl+x">Cut</button>
        <button data-combo="ctrl+z">Undo</button>
        <button data-combo="ctrl+y">Redo</button>
        <button data-combo="ctrl+a">All</button>
        <button data-combo="ctrl+s">Save</button>
        <button data-combo="ctrl+f">Find</button>
        <button data-combo="ctrl+w">Close</button>
        <button data-combo="cmd+d">Desktop</button>
      </div>
    </div>

    <div class="panel" data-panel="media" hidden>
      <div class="keys">
        <button data-k="media_volume_mute">🔇</button>
        <button data-k="media_volume_down">🔉</button>
        <button data-k="media_volume_up">🔊</button>
        <button data-k="media_previous">⏮</button>
        <button data-k="media_play_pause">⏯</button>
        <button data-k="media_next">⏭</button>

    </div>

    <div class="panel" data-panel="fn" hidden>
      <div class="keys">
        <button data-k="f1">F1</button><button data-k="f2">F2</button>
        <button data-k="f3">F3</button><button data-k="f4">F4</button>
        <button data-k="f5">F5</button><button data-k="f6">F6</button>
        <button data-k="f7">F7</button><button data-k="f8">F8</button>
        <button data-k="f9">F9</button><button data-k="f10">F10</button>
        <button data-k="f11">F11</button><button data-k="f12">F12</button>
      </div>
    </div>

    <div class="panel" data-panel="touch" hidden>
      <div id="presets"></div>
      <div id="settings"></div>
    </div>
  </div>

<script id="steadytouch-core">
// Pure functions only — no DOM, no globals — so CI can evaluate this block in node.

const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);

// Simplified One Euro filter: alpha climbs to 1 with speed, so a flick adds no latency.
function makeTremorFilter(get) {
  let sx = 0, sy = 0, cx = 0, cy = 0;
  return {
    step(dx, dy) {
      const s = get();
      const speed = Math.hypot(dx, dy);
      if (speed < s.DEADZONE) return { dx: 0, dy: 0 };
      const t = clamp((speed - s.SMOOTH_LO) / Math.max(s.SMOOTH_HI - s.SMOOTH_LO, 1e-6), 0, 1);
      // Alpha 0 would repeat the last output forever, so a slow drag emits nothing.
      const alpha = s.SMOOTH_MIN + (1 - s.SMOOTH_MIN) * t;
      sx = alpha * dx + (1 - alpha) * sx;
      sy = alpha * dy + (1 - alpha) * sy;
      const gain = Math.min(s.GAIN_MIN + speed * s.ACCEL, s.GAIN_MAX);
      cx += sx * gain; cy += sy * gain;
      const ox = Math.round(cx), oy = Math.round(cy);
      cx -= ox; cy -= oy;   // keep the residual, or sub-pixel movement rounds away to nothing
      return { dx: ox, dy: oy };
    },
    reset() { sx = sy = cx = cy = 0; },
  };
}

// Leaving the radius re-anchors and re-arms, so one rest cannot produce two clicks.
function makeDwellDetector(get) {
  let ax = 0, ay = 0, t0 = 0, armed = false, fired = false;
  return {
    step(x, y, now) {
      const s = get();
      if (!armed || Math.hypot(x - ax, y - ay) > s.DWELL_PX) {
        ax = x; ay = y; t0 = now; armed = true; fired = false;
        return { progress: 0, fire: false };
      }
      if (fired) return { progress: 1, fire: false };
      const progress = clamp((now - t0) / Math.max(s.DWELL_MS, 1), 0, 1);
      fired = progress >= 1;
      return { progress, fire: fired };
    },
    reset() { armed = false; fired = false; },
  };
}

// The only path that emits a click, so a gesture that pressed the button can never also click —
// Windows reads a click followed by a drag as a double-click, which resizes window borders.
function tapButton(g, s) {
  if (g.dragged || g.dragLocked) return null;
  if (g.moved >= s.TAP_PX || g.dur >= s.TAP_MS) return null;
  return g.maxN === 1 ? "left" : g.maxN === 2 ? "right" : null;
}

function steadyTouchSelfCheck() {
  const ok = (cond, msg) => { if (!cond) throw new Error("steadytouch: " + msg); };
  const tap = o => tapButton({ dragged: false, dragLocked: false, moved: 0, dur: 0, maxN: 1, ...o },
                             { TAP_PX: 10, TAP_MS: 250 });
  ok(tap({}) === "left", "a still, quick one-finger tap is a left click");
  ok(tap({ maxN: 2 }) === "right", "two fingers tap right");
  ok(tap({ dragged: true }) === null, "a drag must not also emit a click");
  ok(tap({ dragLocked: true }) === null, "taps are suppressed while the button is latched");
  ok(tap({ moved: 10 }) === null, "travel past TAP_PX is a move, not a tap");
  ok(tap({ dur: 250 }) === null, "a touch held past TAP_MS is not a tap");
  ok(tap({ maxN: 3 }) === null, "three fingers click nothing");
  // Unity gain keeps the assertions about the filter, not about acceleration.
  const base = { GAIN_MIN: 1, GAIN_MAX: 1, ACCEL: 0, DEADZONE: 0,
                 SMOOTH_LO: 1, SMOOTH_HI: 10, SMOOTH_MIN: 0.1 };
  const filt = s => makeTremorFilter(() => Object.assign({}, base, s));

  const f0 = filt();
  for (let i = 0; i < 5; i++) {
    const o = f0.step(0, 0);
    ok(o.dx === 0 && o.dy === 0, "zero input must emit nothing");
  }

  const f1 = filt();
  let last = null;
  for (let i = 0; i < 30; i++) last = f1.step(20, -20);
  ok(Math.abs(last.dx - 20) <= 1 && Math.abs(last.dy + 20) <= 1,
     `fast input must pass through within 1px, got ${last.dx},${last.dy}`);

  const f2 = filt();
  let out = 0;
  for (let i = 0; i < 40; i++) out += Math.abs(f2.step(i % 2 ? 2 : -2, 0).dx);
  ok(out < 40 * 2, `low-speed jitter must be damped, travel was ${out} of 80`);

  const f3 = filt({ SMOOTH_MIN: 1 });
  let moved = 0;
  for (let i = 0; i < 20; i++) moved += f3.step(0.3, 0).dx;
  ok(moved > 0, "repeated sub-pixel input must eventually emit movement");

  const f4 = filt({ DEADZONE: 1, SMOOTH_MIN: 1 });
  let sum = 0;
  for (let i = 0; i < 20; i++) sum += Math.abs(f4.step(0.5, 0.5).dx);
  ok(sum === 0, "input below the dead zone must emit nothing");

  const f5 = filt({ SMOOTH_MIN: 1 });
  f5.step(0.4, 0.4); f5.reset();
  ok(f5.step(0.4, 0.4).dx === 0, "reset must clear the sub-pixel carry");

  const dwell = () => makeDwellDetector(() => ({ DWELL_MS: 100, DWELL_PX: 5 }));
  const fires = (d, pts) => pts.filter(([x, y, t]) => d.step(x, y, t).fire).length;

  ok(fires(dwell(), [[0, 0, 0], [0, 0, 50], [0, 0, 99]]) === 0,
     "dwell must not fire before DWELL_MS");
  ok(fires(dwell(), [[0, 0, 0], [0, 0, 50], [0, 0, 100], [0, 0, 150], [0, 0, 900]]) === 1,
     "dwell must fire exactly once while the finger rests");
  ok(fires(dwell(), [[0, 0, 0], [20, 0, 50], [40, 0, 100], [60, 0, 150]]) === 0,
     "dwell must not fire while the finger is moving");

  const d3 = dwell();
  ok(fires(d3, [[0, 0, 0], [0, 0, 100]]) === 1 &&
     fires(d3, [[50, 0, 150], [50, 0, 260]]) === 1,
     "dwell must re-arm after leaving the radius");

  const d4 = dwell();
  d4.step(0, 0, 0);
  ok(d4.step(3, 3, 100).fire, "drift inside DWELL_PX must still fire");

  const d5 = dwell();
  d5.step(0, 0, 0); d5.reset();
  ok(!d5.step(0, 0, 100).fire, "reset must disarm the pending dwell");

  console.log("steadytouch self-check OK");
}
</script>

<script>
const token = new URLSearchParams(location.search).get("k") || localStorage.getItem("kbm-token") || "";
const dot = document.getElementById("dot"), stat = document.getElementById("stat");
let ws, retryT = null;

// The generated manifest preserves the token when launched from a home screen.
const mlink = document.createElement("link");
mlink.rel = "manifest";
mlink.href = `/manifest.json?k=${encodeURIComponent(token)}`;
document.head.appendChild(mlink);

function connect() {
  clearTimeout(retryT);
  stat.textContent = "connecting…";
  ws = new WebSocket(`ws://${location.host}/ws?k=${encodeURIComponent(token)}`);
  ws.onopen  = () => {
    dot.classList.add("on");  stat.textContent = "connected"; localStorage.setItem("kbm-token", token);
    // Clear any button a previous session left held; releasing an unpressed button is a no-op.
    send({ t: "release", b: "left" });
    setDragLock(false, false);
  };
  ws.onclose = () => { endDrag(); setDragLock(false, false); dot.classList.remove("on"); diagnose(); retryT = setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
}
async function diagnose() {
  let why = "reconnecting…";
  if (!token) why = "no token — open the QR link once";
  else try {
    const r = await fetch(`/ping?k=${encodeURIComponent(token)}`);
    if (!r.ok) why = "wrong token — rescan the QR";
  } catch (e) { why = "PC unreachable — agent on? same WiFi?"; }
  stat.textContent = why + " (tap to retry)";
}
stat.addEventListener("click", connect);
dot.addEventListener("click", connect);
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
connect();

// Wake Lock API needs a secure context, which a plain-http LAN origin is not —
// fall back to NoSleep.js's invisible looping-video trick (MIT, github.com/richtr/NoSleep.js).
let wakeLock = null, sleepVid = null;
async function keepAwake() {
  if (navigator.wakeLock) {
    try { wakeLock = wakeLock || await navigator.wakeLock.request("screen"); return; } catch (e) { /* fall through */ }
  }
  if (!sleepVid) {
    sleepVid = document.createElement("video");
    sleepVid.setAttribute("playsinline", ""); sleepVid.muted = true; sleepVid.loop = true;
    for (const [type, src] of [["webm", AWAKE_WEBM], ["mp4", AWAKE_MP4]]) {
      const s = document.createElement("source"); s.type = `video/${type}`; s.src = src;
      sleepVid.appendChild(s);
    }
    sleepVid.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.appendChild(sleepVid);
  }
  if (sleepVid.paused) sleepVid.play().catch(() => {});
}
document.addEventListener("pointerdown", () => keepAwake());
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { wakeLock = null; keepAwake(); return; }
  // Backgrounding mid-drag would leave the button held on the PC.
  endDrag();
  if (dragLocked) setDragLock(false);
  stopDwell();
});

// The Default preset. SMOOTH_MIN 1 with DEADZONE 0 makes the tremor filter transparent.
const DEFAULTS = {
  GAIN_MIN: 1.6, GAIN_MAX: 5.0, ACCEL: 0.10,
  TAP_MS: 250, TAP_PX: 10,
  HOLD_ON: true, HOLD_MS: 500, HOLD_PX: 12,
  SCROLL_PX: 12, ZOOM_PX: 45, ACTIVATE_PX: 5, ZOOM_ACTIVATE_PX: 12,
  ZOOM_DECISION_MS: 40, MODE_BIAS: 1.15, NATURAL_V: true, NATURAL_H: true,
  DEADZONE: 0, SMOOTH_LO: 1, SMOOTH_HI: 10, SMOOTH_MIN: 1,
  DWELL_ON: false, DWELL_MS: 800, DWELL_PX: 12, DWELL_BTN: "left",
};
const S = { ...DEFAULTS };

// The panel is generated from this: [key, label, min, max, step] for a slider,
// [key, label] for a checkbox, [key, label, [choices]] for a select.
const CONTROLS = [
  ["DWELL_ON", "Dwell click (hold still to click)"],
  ["DWELL_MS", "Dwell hold time (ms)", 300, 2500, 50],
  ["DWELL_PX", "Dwell steadiness allowance (px)", 4, 40, 1],
  ["DWELL_BTN", "Dwell fires", ["left", "right", "middle"]],
  ["GAIN_MIN", "Slow-move gain", 0.5, 4, 0.1],
  ["GAIN_MAX", "Fast-flick gain", 1, 10, 0.1],
  ["ACCEL", "Acceleration", 0, 0.3, 0.01],
  ["TAP_MS", "Tap time limit (ms)", 100, 800, 10],
  ["TAP_PX", "Tap wobble allowance (px)", 4, 40, 1],
  ["HOLD_ON", "Press-and-hold to drag"],
  ["HOLD_MS", "Hold time before drag (ms)", 200, 1500, 50],
  ["HOLD_PX", "Hold wobble allowance (px)", 4, 40, 1],
  ["SCROLL_PX", "Scroll step (px)", 4, 40, 1],
  ["ZOOM_PX", "Zoom step (px)", 15, 120, 5],
  ["ACTIVATE_PX", "Scroll dead zone (px)", 1, 20, 1],
  ["ZOOM_ACTIVATE_PX", "Pinch dead zone (px)", 4, 40, 1],
  ["ZOOM_DECISION_MS", "Pinch decision delay (ms)", 0, 150, 5],
  ["MODE_BIAS", "Scroll-vs-pinch bias", 1, 2, 0.05],
  ["DEADZONE", "Tremor dead zone (px)", 0, 3, 0.1],
  ["SMOOTH_MIN", "Steadiness (1 = off)", 0.05, 1, 0.05],
  ["SMOOTH_LO", "Steadying starts below (px)", 0, 6, 0.5],
  ["SMOOTH_HI", "Full speed passes through (px)", 2, 30, 1],
  ["NATURAL_V", "Natural scroll — vertical"],
  ["NATURAL_H", "Natural scroll — horizontal"],
];

const PRESETS = {
  Default: {},
  Precision: { GAIN_MIN: 1.0, GAIN_MAX: 2.5, ACCEL: 0.05, ACTIVATE_PX: 3, ZOOM_ACTIVATE_PX: 8,
               DEADZONE: 0.3, SMOOTH_MIN: 0.5, SMOOTH_LO: 1, SMOOTH_HI: 8 },
  Accessibility: { GAIN_MIN: 1.2, GAIN_MAX: 3.0, ACCEL: 0.06, TAP_MS: 500, TAP_PX: 22,
                   HOLD_MS: 800, HOLD_PX: 20,
                   DEADZONE: 0.8, SMOOTH_MIN: 0.12, SMOOTH_LO: 0.5, SMOOTH_HI: 12,
                   DWELL_ON: true, DWELL_MS: 900, DWELL_PX: 16 },
};

const CHOICES = Object.fromEntries(
  CONTROLS.filter(c => Array.isArray(c[2])).map(([k, , choices]) => [k, choices]));

// ponytail: localStorage is per-origin, so a DHCP change loses tuning; presets recover in 2 taps.
function loadSettings() {
  let o = {};
  try { o = JSON.parse(localStorage.getItem("kbm-settings")) || {}; } catch (e) { /* corrupt → defaults */ }
  for (const k in DEFAULTS) {
    if (typeof o[k] !== typeof DEFAULTS[k]) continue;
    if (CHOICES[k] && !CHOICES[k].includes(o[k])) continue;
    S[k] = o[k];
  }
}
function saveSettings() { try { localStorage.setItem("kbm-settings", JSON.stringify(S)); } catch (e) {} }

function buildSettings() {
  const box = document.getElementById("settings");
  for (const [k, label, min, max, step] of CONTROLS) {
    const row = document.createElement("div");
    row.className = "set";
    row.innerHTML = `<label for="s-${k}">${label}</label>` + (
      CHOICES[k] ? `<select id="s-${k}">${CHOICES[k].map(c => `<option>${c}</option>`).join("")}</select>`
      : typeof DEFAULTS[k] === "boolean" ? `<input type="checkbox" id="s-${k}">`
      : `<input type="range" id="s-${k}" min="${min}" max="${max}" step="${step}"><output></output>`);
    const input = row.querySelector("input,select");
    input.oninput = () => {
      S[k] = CHOICES[k] ? input.value
           : input.type === "checkbox" ? input.checked
           : parseFloat(input.value);
      const out = row.querySelector("output");
      if (out) out.textContent = S[k];
      saveSettings();
    };
    box.appendChild(row);
  }
  syncSettings();
}
function syncSettings() {
  for (const [k] of CONTROLS) {
    const input = document.getElementById(`s-${k}`);
    if (input.type === "checkbox") input.checked = S[k];
    else input.value = S[k];
    const out = input.nextElementSibling;
    if (out && out.tagName === "OUTPUT") out.textContent = S[k];
  }
}
function buildPresets() {
  const box = document.getElementById("presets");
  for (const [name, over] of Object.entries(PRESETS)) {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => { Object.assign(S, DEFAULTS, over); saveSettings(); syncSettings(); };
    box.appendChild(b);
  }
}
loadSettings(); buildPresets(); buildSettings();

const tremor = makeTremorFilter(() => S);
const dwellDet = makeDwellDetector(() => S);
const pad = document.getElementById("pad");
const ring = document.getElementById("dwell");
const draglock = document.getElementById("draglock");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const pts = new Map();
let g = null;
let dragging = false, dragLocked = false;
let dwellRAF = 0, padRect = null, holdTimer = 0;

// Press-and-hold, not double-tap-then-hold: a double tap must send a click before its press,
// and Windows reads that pair as a double-click, which resizes the window instead of dragging.
function armHold() {
  if (!S.HOLD_ON || dragLocked || dragging) return;
  holdTimer = setTimeout(() => {
    holdTimer = 0;
    send({ t: "press", b: "left" });
    dragging = true;
    pad.classList.add("held");
    navigator.vibrate?.(15);
  }, S.HOLD_MS);
}
function cancelHold() {
  clearTimeout(holdTimer);

function clearMods() { mods.clear(); document.querySelectorAll(".mod").forEach(b => b.classList.remove("on")); }

// Mirror value diffs because mobile IMEs do not reliably emit useful key events.
let lastVal = "";

txt.addEventListener("input", () => {
  let v = txt.value;

  if (mods.size && v.length > lastVal.length) {
    for (const ch of v.slice(lastVal.length)) send({ t: "key", k: ch.toLowerCase(), mods: [...mods] });
    clearMods();
    txt.value = lastVal;
    return;
  }

  let p = 0;  // A common prefix also handles autocorrect rewrites.
  while (p < lastVal.length && p < v.length && lastVal[p] === v[p]) p++;
  for (let i = 0; i < lastVal.length - p; i++) send({ t: "key", k: "backspace" });

  const added = v.slice(p);
  if (added.includes("\n")) {
    added.split("\n").forEach((seg, i) => {
      if (i) send({ t: "key", k: "enter" });
      if (seg) send({ t: "text", s: seg });
    });
    v = v.replace(/\n/g, ""); txt.value = v;
  } else if (added) {
    send({ t: "text", s: added });
  }
  lastVal = v;
});

});
