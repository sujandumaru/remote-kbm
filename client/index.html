<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2027">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.png">
<title>remote-kbm</title>
<style>
  :root { --bg:#111418; --pad:#1b2027; --pad2:#232a33; --fg:#e8ecf1; --dim:#8b95a1; --accent:#3d7dfb; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; overscroll-behavior:none;
              background:var(--bg); color:var(--fg); font:15px/1.3 system-ui,sans-serif; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #bar { display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--pad); }
  #dot { width:11px; height:11px; border-radius:50%; background:#e0483d; transition:background .2s; }
  #dot.on { background:#37c26b; }
  #bar .grow { flex:1; }
  button { font:inherit; color:var(--fg); background:var(--pad2); border:0; border-radius:9px;
           padding:11px 14px; cursor:pointer; }
  button:active { background:#2f3946; }
  #pad { flex:1; touch-action:none; position:relative; background:var(--bg);
         background-image:radial-gradient(var(--pad2) 1px, transparent 1px); background-size:22px 22px; }
  #hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
          color:var(--dim); text-align:center; padding:24px; pointer-events:none; }
  #clicks { display:flex; gap:8px; padding:8px 8px 10px; }
  #clicks button { flex:1; padding:16px; }
  #kb { background:var(--pad); padding:8px; display:none; gap:8px; flex-direction:column; }
  #kb.show { display:flex; }
  #txtrow { display:flex; gap:8px; }
  #txtrow textarea { flex:1; font:16px system-ui; padding:12px; border-radius:9px;
                     border:1px solid var(--pad2); background:var(--bg); color:var(--fg); resize:none; }
  #clr { padding:0 16px; }
  #tabs { display:flex; gap:6px; }
  #tabs .tab { flex:1; padding:10px 4px; background:var(--bg); color:var(--dim); }
  #tabs .tab.on { background:var(--pad2); color:var(--fg); }
  .panel { display:flex; flex-direction:column; gap:8px; }
  .panel[hidden] { display:none; }
  .keys { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }
  .keys button { padding:12px 6px; }
  .mod.on { background:var(--accent); }
</style>
</head>
<body>
  <div id="bar">
    <span id="dot"></span><span id="stat">connecting…</span>
    <span class="grow"></span>
    <button id="kbtoggle">⌨ Keyboard</button>
  </div>

  <div id="pad"><div id="hint">Drag to move · tap = click · two-finger tap = right-click<br>two-finger drag = scroll · pinch = zoom · double-tap-hold = drag</div></div>

  <div id="clicks">
    <button id="lclick">Left click</button>
    <button id="rclick">Right click</button>
  </div>

  <div id="kb">
    <div id="tabs">
      <button class="tab on" data-tab="type">Type</button>
      <button class="tab" data-tab="shortcuts">Shortcuts</button>
      <button class="tab" data-tab="media">Media</button>
      <button class="tab" data-tab="fn">Fn</button>
    </div>

    <div class="panel" data-panel="type">
      <div id="txtrow">
        <textarea id="txt" rows="2" autocomplete="off" autocorrect="off" autocapitalize="off"
                  spellcheck="false" aria-label="Text to send to the PC"
                  placeholder="Type here — mirrors to the PC"></textarea>
        <button id="clr" title="Clear this echo (nothing sent)">✕</button>
      </div>
      <div class="keys">
        <button data-k="esc">Esc</button><button data-k="tab">Tab</button>
        <button data-k="left">←</button><button data-k="up">↑</button>
        <button data-k="down">↓</button><button data-k="right">→</button>
        <button data-k="enter">Enter</button><button data-k="backspace">⌫</button>
        <button data-k="delete">Del</button>
        <button class="mod" data-mod="ctrl">Ctrl</button><button class="mod" data-mod="alt">Alt</button>
        <button class="mod" data-mod="shift">Shift</button>
        <button class="mod" data-mod="cmd">⊞ Win</button>
      </div>
    </div>

    <div class="panel" data-panel="shortcuts" hidden>
      <div class="keys">
        <button data-combo="cmd">⊞ Start</button>
        <button data-combo="alt+tab">Alt↹Tab</button>
        <button data-combo="ctrl+c">Copy</button>
        <button data-combo="ctrl+v">Paste</button>
        <button data-combo="ctrl+x">Cut</button>
        <button data-combo="ctrl+z">Undo</button>
        <button data-combo="ctrl+y">Redo</button>
        <button data-combo="ctrl+a">All</button>
        <button data-combo="ctrl+s">Save</button>
        <button data-combo="ctrl+f">Find</button>
        <button data-combo="ctrl+w">Close</button>
        <button data-combo="cmd+d">Desktop</button>
      </div>
    </div>

    <div class="panel" data-panel="media" hidden>
      <div class="keys">
        <button data-k="media_volume_mute">🔇</button>
        <button data-k="media_volume_down">🔉</button>
        <button data-k="media_volume_up">🔊</button>
        <button data-k="media_previous">⏮</button>
        <button data-k="media_play_pause">⏯</button>
        <button data-k="media_next">⏭</button>
      </div>
    </div>

    <div class="panel" data-panel="fn" hidden>
      <div class="keys">
        <button data-k="f1">F1</button><button data-k="f2">F2</button>
        <button data-k="f3">F3</button><button data-k="f4">F4</button>
        <button data-k="f5">F5</button><button data-k="f6">F6</button>
        <button data-k="f7">F7</button><button data-k="f8">F8</button>
        <button data-k="f9">F9</button><button data-k="f10">F10</button>
        <button data-k="f11">F11</button><button data-k="f12">F12</button>
      </div>
    </div>
  </div>

<script>
// ---- connection -------------------------------------------------------------
// Token comes from the QR URL (or localStorage as a fallback for older installs).
const token = new URLSearchParams(location.search).get("k") || localStorage.getItem("kbm-token") || "";
const dot = document.getElementById("dot"), stat = document.getElementById("stat");
let ws, retryT = null;

// The manifest link must carry the token (the server bakes it into start_url),
// so it is injected here instead of being a static tag.
const mlink = document.createElement("link");
mlink.rel = "manifest";
mlink.href = `/manifest.json?k=${encodeURIComponent(token)}`;
document.head.appendChild(mlink);

function connect() {
  clearTimeout(retryT);
  stat.textContent = "connecting…";
  ws = new WebSocket(`ws://${location.host}/ws?k=${encodeURIComponent(token)}`);
  ws.onopen  = () => { dot.classList.add("on");  stat.textContent = "connected"; localStorage.setItem("kbm-token", token); };
  ws.onclose = () => { dot.classList.remove("on"); diagnose(); retryT = setTimeout(connect, 1500); };
  ws.onerror = () => ws.close();
}
async function diagnose() {  // a raw WS close can't say why — ask over HTTP
  let why = "reconnecting…";
  if (!token) why = "no token — open the QR link once";
  else try {
    const r = await fetch(`/ping?k=${encodeURIComponent(token)}`);
    if (!r.ok) why = "wrong token — rescan the QR";
  } catch (e) { why = "PC unreachable — agent on? same WiFi?"; }
  stat.textContent = why + " (tap to retry)";
}
stat.addEventListener("click", connect);
dot.addEventListener("click", connect);
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
connect();

// ---- keep the phone screen awake ---------------------------------------------
// Wake Lock API needs a secure context, which a plain-http LAN origin is not —
// fall back to NoSleep.js's invisible looping-video trick (MIT, github.com/richtr/NoSleep.js).
let wakeLock = null, sleepVid = null;
async function keepAwake() {
  if (navigator.wakeLock) {
    try { wakeLock = wakeLock || await navigator.wakeLock.request("screen"); return; } catch (e) { /* fall through */ }
  }
  if (!sleepVid) {
    sleepVid = document.createElement("video");
    sleepVid.setAttribute("playsinline", ""); sleepVid.muted = true; sleepVid.loop = true;
    for (const [type, src] of [["webm", AWAKE_WEBM], ["mp4", AWAKE_MP4]]) {
      const s = document.createElement("source"); s.type = `video/${type}`; s.src = src;
      sleepVid.appendChild(s);
    }
    sleepVid.style.cssText = "position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
    document.body.appendChild(sleepVid);
  }
  if (sleepVid.paused) sleepVid.play().catch(() => {});   // needs a user gesture; retried on next touch
}
document.addEventListener("pointerdown", () => keepAwake());
document.addEventListener("visibilitychange", () => { if (!document.hidden) { wakeLock = null; keepAwake(); } });

// ---- trackpad ---------------------------------------------------------------
// Trackpad-style acceleration: slow finger stays precise, fast flick crosses the screen.
const GAIN_MIN = 1.6, GAIN_MAX = 5.0, ACCEL = 0.10;
const TAP_MS = 250, TAP_PX = 10, DBL_MS = 300;
const SCROLL_PX = 16, ZOOM_PX = 55, ACTIVATE_PX = 8, NATURAL = true;
const pad = document.getElementById("pad");
const pts = new Map();               // pointerId -> {x,y,px,py}
let g = null;                        // current gesture aggregate
let lastTapUp = 0, dragging = false, armedDrag = false;
let lastCentroid = null, lastDist = 0, twoMode = null, scrollAcc = 0, panAcc = 0, zoomAcc = 0;

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function centroid() { let x = 0, y = 0; for (const p of pts.values()) { x += p.x; y += p.y; } return { x: x / pts.size, y: y / pts.size }; }

pad.addEventListener("pointerdown", e => {
  pad.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY, px: e.clientX, py: e.clientY });
  if (pts.size === 1) {
    g = { start: performance.now(), maxN: 1, moved: 0 };
    armedDrag = (performance.now() - lastTapUp) < DBL_MS;   // double-tap...hold -> drag
  }
  g.maxN = Math.max(g.maxN, pts.size);
  if (pts.size === 2) { lastCentroid = centroid(); const a = [...pts.values()]; lastDist = dist(a[0], a[1]); twoMode = null; scrollAcc = panAcc = zoomAcc = 0; }
});

pad.addEventListener("pointermove", e => {
  const p = pts.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;

  if (pts.size === 1) {
    const dx = p.x - p.px, dy = p.y - p.py; p.px = p.x; p.py = p.y;
    g.moved += Math.hypot(dx, dy);
    if (armedDrag && g.moved > TAP_PX) { send({ t: "press", b: "left" }); dragging = true; armedDrag = false; }
    if (dx || dy) {
      const gain = Math.min(GAIN_MIN + Math.hypot(dx, dy) * ACCEL, GAIN_MAX);
      send({ t: "move", dx: Math.round(dx * gain), dy: Math.round(dy * gain) });
    }
  } else if (pts.size >= 2) {
    const c = centroid(), a = [...pts.values()], d = dist(a[0], a[1]);
    const dcx = c.x - lastCentroid.x, dcy = c.y - lastCentroid.y, dd = d - lastDist;
    lastCentroid = c; lastDist = d; g.moved += Math.hypot(dcx, dcy) + Math.abs(dd);
    if (!twoMode) { if (Math.abs(dd) > ACTIVATE_PX) twoMode = "zoom"; else if (Math.hypot(dcx, dcy) > ACTIVATE_PX) twoMode = "scroll"; }
    if (twoMode === "scroll") {
      scrollAcc += dcy; panAcc += dcx;
      while (Math.abs(scrollAcc) >= SCROLL_PX) { const s = Math.sign(scrollAcc); send({ t: "scroll", dx: 0, dy: NATURAL ? s : -s }); scrollAcc -= s * SCROLL_PX; }
      while (Math.abs(panAcc) >= SCROLL_PX) { const s = Math.sign(panAcc); send({ t: "scroll", dx: NATURAL ? s : -s, dy: 0 }); panAcc -= s * SCROLL_PX; }
    } else if (twoMode === "zoom") {
      zoomAcc += dd;
      while (Math.abs(zoomAcc) >= ZOOM_PX) { const s = Math.sign(zoomAcc); send({ t: "zoom", d: s }); zoomAcc -= s * ZOOM_PX; }
    }
  }
});

function endPointer(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size === 1) { const p = [...pts.values()][0]; p.px = p.x; p.py = p.y; }  // avoid jump on 2->1
  if (pts.size > 0) return;                                // gesture not finished
  const dur = performance.now() - g.start;
  if (dragging) { send({ t: "release", b: "left" }); dragging = false; }
  else if (g.moved < TAP_PX && dur < TAP_MS) {
    if (g.maxN === 1) { send({ t: "click", b: "left", n: 1 }); lastTapUp = performance.now(); }
    else if (g.maxN === 2) send({ t: "click", b: "right", n: 1 });
  }
  armedDrag = false; g = null;
}
pad.addEventListener("pointerup", endPointer);
pad.addEventListener("pointercancel", endPointer);

document.getElementById("lclick").onclick = () => send({ t: "click", b: "left",  n: 1 });
document.getElementById("rclick").onclick = () => send({ t: "click", b: "right", n: 1 });

// ---- keyboard ---------------------------------------------------------------
const kb = document.getElementById("kb"), txt = document.getElementById("txt");
const mods = new Set();
document.getElementById("kbtoggle").onclick = () => { kb.classList.toggle("show"); if (kb.classList.contains("show")) txt.focus(); };

document.querySelectorAll("#tabs .tab").forEach(t => t.onclick = () => {
  document.querySelectorAll("#tabs .tab").forEach(x => x.classList.toggle("on", x === t));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.panel !== t.dataset.tab);
  if (t.dataset.tab === "type") txt.focus();
});

function clearMods() { mods.clear(); document.querySelectorAll(".mod").forEach(b => b.classList.remove("on")); }

// The field keeps what you type (visible echo); edits are mirrored to the PC by
// diffing values on input events — mobile IMEs make keydown/keyCode unreliable.
let lastVal = "";

// Everything routes through `input` — the one event mobile IMEs fire reliably.
// (beforeinput with usable `data` is flaky on Android, which broke Ctrl+C.)
txt.addEventListener("input", () => {
  let v = txt.value;

  // Latched modifier (Ctrl/Alt/Win…): send the newly typed char(s) as a combo, don't echo.
  if (mods.size && v.length > lastVal.length) {
    for (const ch of v.slice(lastVal.length)) send({ t: "key", k: ch.toLowerCase(), mods: [...mods] });
    clearMods();
    txt.value = lastVal;                      // keep the combo char out of the echo box
    return;
  }

  let p = 0;                                  // common prefix — handles autocorrect rewrites too
  while (p < lastVal.length && p < v.length && lastVal[p] === v[p]) p++;
  for (let i = 0; i < lastVal.length - p; i++) send({ t: "key", k: "backspace" });

  const added = v.slice(p);
  if (added.includes("\n")) {                 // Enter in a textarea shows up as a newline
    added.split("\n").forEach((seg, i) => {
      if (i) send({ t: "key", k: "enter" });
      if (seg) send({ t: "text", s: seg });
    });
    v = v.replace(/\n/g, ""); txt.value = v;  // keep the echo box single-line-ish
  } else if (added) {
    send({ t: "text", s: added });
  }
  lastVal = v;
});

// ponytail: empty-field backspace produces no input event; keydown catches it on iOS
// and most Android IMEs — the few that report 229 here simply can't do this one case.
txt.addEventListener("keydown", e => {
  if (e.key === "Backspace" && txt.value === "") send({ t: "key", k: "backspace" });
});

document.getElementById("clr").onclick = () => { txt.value = ""; lastVal = ""; txt.focus(); };

document.querySelectorAll(".keys button").forEach(b => {
  b.onclick = () => {
    if (b.dataset.mod) { mods.has(b.dataset.mod) ? mods.delete(b.dataset.mod) : mods.add(b.dataset.mod); b.classList.toggle("on"); txt.focus(); return; }
    if (b.dataset.combo) { const parts = b.dataset.combo.split("+"); const k = parts.pop(); send({ t: "key", k, mods: parts }); return; }
    send({ t: "key", k: b.dataset.k, mods: [...mods] }); clearMods(); txt.focus();
  };
});
// Tiny looping videos from NoSleep.js (MIT) used only as the keep-awake fallback.
